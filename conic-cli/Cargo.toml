[package]
name = "conic-cli"
version = "0.6.8"
edition = "2024"
description = "A SCPTu Data-Driven Evaluator."

[[bin]]
name = "conic"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
indicatif =  { version = "0.18.6" }
regex = { version = "1.13.1" }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0" }
toml = { version = "1.1.4" }
