[package]
name = "conic"
version = "0.4.0"
edition = "2024"

[lib]
name = "_lib"
crate-type = ["cdylib"]

[dependencies]
polars = { version = "0.53.0", default-features = false }
pyo3 = { version = "0.27.2", features = ["extension-module", "abi3-py312"] }
pyo3-polars = { version = "0.26.0", features = ["derive", "dtype-struct", "dtype-array"] }
serde = { version = "1.0", features = ["derive"] }
num-traits = { version = "0.2" }
