name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  id-token: write
  contents: read

jobs:
  build:
    name: Build wheel (${{ matrix.platform.target }})
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: ""
          - runner: macos-14
            target: aarch64-apple-darwin
            ext: ""
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            ext: ".exe"

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}

      - name: Build CLI binary
        shell: bash
        run: |
          cargo build --release --target ${{ matrix.platform.target }} -p conic-cli
          mkdir -p data/scripts
          cp target/${{ matrix.platform.target }}/release/conic${{ matrix.platform.ext }} data/scripts/conic${{ matrix.platform.ext }}
          # maturin has no build-time --data flag, so the data dir is declared
          # under [tool.maturin] here only (kept out of the repo so dev and
          # sdist builds, which have no data/ dir, do not fail with
          # "No such data directory").
          python3 - <<'PY'
          from pathlib import Path
          path = Path("pyproject.toml")
          text = path.read_text()
          path.write_text(text.replace("[tool.maturin]\n", '[tool.maturin]\ndata = "data"\n', 1))
          PY

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist
          sccache: "true"

      - name: Upload wheel as artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.platform.target }}
          path: dist/

  sdist:
    name: Build sdist
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist

      - name: Upload sdist as artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: dist/

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [build, sdist]
    environment: pypi

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
