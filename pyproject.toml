[project]
name = "conic"
version = "0.6.1"
description = "A SCPTu Data-Driven Evaluator."
readme = "README.md"
license = "AGPL-3.0-or-later"
authors = [
    { name = "Francesco Franco", email = "ffrancoa97@gmail.com" }
]

requires-python = ">=3.14"
dependencies = ["polars>=1.41.2"]

classifiers = [
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Rust",
  "Topic :: Scientific/Engineering",
  "Typing :: Typed",
]

[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-benchmark>=5.2.3",
    "ruff>=0.15.14",
]

[tool.maturin]
module-name = "conic._lib"
python-packages = ["conic"]
python-source = "src"

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "src/*.rs" },
    { file = "Cargo.toml" },
    { file = "Cargo.lock" },
]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
    "RUF", # ruff-specific rules
]

ignore = [
    "C408",
    "RUF001",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
