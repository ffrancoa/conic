[project]
name = "conic"
version = "0.1.0"
description = "CPT/SCPTu Data-Driven Evaluator."
readme = "README.md"
license = "AGPL-3.0-or-later"
authors = [
    { name = "Francesco Franco", email = "ffrancoa97@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "polars>=1.40.1",
    "pydantic>=2.13.4",
    "pytest-benchmark>=5.2.3",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipython>=9.13.0",
    "pytest>=9.0.3",
    "ruff>=0.15.14",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
    "RUF", # ruff-specific rules
]

ignore = [
    "C408",
    "E501",
    "RUF001",
    "UP045",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
